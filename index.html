<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>재이존나패기</title>
<link href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=DotGothic16&display=swap" rel="stylesheet">
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#fff;color-scheme:light}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{height:100%;margin:0;background:var(--bg)}
body{display:flex;align-items:center;justify-content:center;overflow:hidden}
canvas{width:min(100%,100dvh);height:auto;aspect-ratio:1/1;cursor:none;touch-action:none;display:block}
</style>
</head>
<body>
<canvas id="c" width="480" height="640" aria-label="ビンタ道場: 마우스를 빠르게 휘둘러 캐릭터의 뺨을 때리는 게임"></canvas>
<script>
const cv=document.getElementById('c'),g=cv.getContext('2d');
const W=640,H=640,INK='#1b0a2e',SK='#ffd2a8';
const FD='"Dela Gothic One","Hiragino Sans","Noto Sans JP",sans-serif';
const FP='"DotGothic16","Hiragino Sans","Noto Sans JP",sans-serif';
const FK='"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif';
const RM=matchMedia('(prefers-reduced-motion: reduce)').matches;
const P=['パァン!','バシッ!','ビンタ!!','ペチーン!','スパーン!'];
const R=['아야...','왜때려요오...','아파요..','앗...!','그만...'];
let mx=360,my=520,vx=0,vy=0,sp=0,lastT=performance.now(),cool=0,pokeCool=0;
let hits=0,combo=0,lastHit=0,shake=0,flash=0,kick=0,dizzy=0,t=0,say=null;
const face={x:0,r:0,vx:0,vr:0,hurt:0,mark:0,mx:0,my:0,poke:0};
let parts=[],pops=[],trail=[];
const cl=(v,a,b)=>Math.max(a,Math.min(b,v));

let ac;
function audio(){
  if(!ac){try{ac=new(window.AudioContext||window.webkitAudioContext)()}catch(e){}}
  if(ac&&ac.state==='suspended')ac.resume().catch(()=>{});
}
function noise(t0,dur,type,freq,q,gain,curve){
  const len=Math.ceil(ac.sampleRate*dur),b=ac.createBuffer(1,len,ac.sampleRate),d=b.getChannelData(0);
  for(let i=0;i<len;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/len,curve);
  const s=ac.createBufferSource();s.buffer=b;
  const f=ac.createBiquadFilter();f.type=type;f.frequency.value=freq;f.Q.value=q;
  const gn=ac.createGain();gn.gain.value=gain;
  s.connect(f);f.connect(gn);gn.connect(out());s.start(t0);
}
let mst;
function out(){
  if(!mst){mst=ac.createDynamicsCompressor();mst.threshold.value=-14;mst.ratio.value=8;const m=ac.createGain();m.gain.value=1.3;mst.connect(m);m.connect(ac.destination)}
  return mst;
}
function snd(p){
  if(!ac)return;
  const t0=ac.currentTime,v=.92+Math.random()*.16,pw=Math.min(1,p/4)*.3+.7;
  noise(t0,.004,'highpass',5000,.7,2.2*pw,1);
  noise(t0,.06,'highpass',2500*v,.7,1.6*pw,3);
  noise(t0+.012,.08,'bandpass',4500*v,1,1.1*pw,3);
  noise(t0+.02,.18,'bandpass',6500,.6,.45*pw,2);
  noise(t0,.09,'bandpass',1400*v,1,.9*pw,3);
  const o=ac.createOscillator(),og=ac.createGain();
  o.type='triangle';o.frequency.setValueAtTime(700*v,t0);o.frequency.exponentialRampToValueAtTime(250,t0+.05);
  og.gain.setValueAtTime(.3*pw,t0);og.gain.exponentialRampToValueAtTime(.001,t0+.07);
  o.connect(og);og.connect(out());o.start(t0);o.stop(t0+.08);
}

function pos(e){const r=cv.getBoundingClientRect();return[(e.clientX-r.left)*W/r.width,(e.clientY-r.top)*H/r.height]}
cv.addEventListener('pointerdown',e=>{audio();cv.setPointerCapture(e.pointerId);move(e)});
cv.addEventListener('pointermove',move);
cv.addEventListener('contextmenu',e=>e.preventDefault());
function move(e){
  audio();
  const[x,y]=pos(e),now=performance.now(),dt=Math.max(1,now-lastT);
  vx=vx*.5+((x-mx)/dt)*.5;vy=vy*.5+((y-my)/dt)*.5;sp=Math.hypot(vx,vy);
  check(mx,my,x,y);
  mx=x;my=y;lastT=now;
}
function check(x0,y0,x1,y1){
  const now=performance.now();
  let hit=null;
  for(let i=0;i<=8;i++){
    const px=x0+(x1-x0)*i/8,py=y0+(y1-y0)*i/8;
    const ex=(px-322-face.x)/148,ey=(py-153)/138;
    if(ex*ex+ey*ey<1){hit=[px,py];break}
  }
  if(!hit)return;
  if(sp>1.1&&now>cool){slap(Math.sign(vx)||1,Math.min(sp,5),hit[0],hit[1]);cool=now+260}
  else if(sp>.15&&now>pokeCool){face.poke=1;pokeCool=now+120}
}
function slap(dir,power,hx,hy){
  const now=performance.now();
  combo=now-lastHit<1100?combo+1:1;lastHit=now;hits++;
  face.vx=dir*(7+power*3);face.vr=dir*(.05+power*.025);face.hurt=1;face.mark=1;
  face.mx=cl(hx-240-face.x,-90,90);face.my=cl(hy-300,-20,80);
  shake=RM?2:10+power*3;flash=RM?0:.7;kick=1;
  say={t:0,text:R[Math.floor(Math.random()*R.length)]};
  if(hits%10===0)dizzy=1.8;
  snd(power);
}

function update(dt){
  const k=dt*60;t+=dt;
  if(performance.now()-lastT>50){vx*=.7;vy*=.7;sp=Math.hypot(vx,vy)}
  face.vx+=-face.x*.12*k;face.vx*=Math.pow(.86,k);face.x+=face.vx*k;
  face.vr+=-face.r*.15*k;face.vr*=Math.pow(.88,k);face.r+=face.vr*k;
  face.hurt=Math.max(0,face.hurt-.03*k);face.mark=Math.max(0,face.mark-.004*k);
  face.poke*=Math.pow(.9,k);shake*=Math.pow(.85,k);flash*=Math.pow(.85,k);kick*=Math.pow(.88,k);
  dizzy=Math.max(0,dizzy-dt);
  trail.push([mx,my,rot()]);if(trail.length>5)trail.shift();
  parts.forEach(p=>{p.x+=p.vx*k;p.y+=p.vy*k;p.vy+=.4*k;p.life-=dt});
  parts=parts.filter(p=>p.life>0);
  pops.forEach(p=>p.t+=dt);pops=pops.filter(p=>p.t<.9);
  if(say){say.t+=dt;if(say.t>1)say=null}
}
const rot=()=>cl(vx*.12,-.7,.7);

  if(!say||!ok(IM.bub))return;
  const pop=say.t<.12?.75+say.t/.12*.25:1;
  g.save();g.globalAlpha=say.t>.8?Math.max(0,(1-say.t)/.2):1;
  g.translate(BD[0],BD[1]+BD[3]);g.scale(pop,pop);g.translate(-BD[0],-(BD[1]+BD[3]));
  g.drawImage(IM.bub,BD[0],BD[1],BD[2],BD[3]);
  let fs=22;g.font=`bold ${fs}px ${FK}`;const mw=BD[2]*.62,w=g.measureText(say.text).width;
  if(w>mw){fs=Math.floor(fs*mw/w);g.font=`bold ${fs}px ${FK}`}
  g.fillStyle=INK;g.textAlign='center';
  g.fillText(say.text,BD[0]+BD[2]*BD[4],BD[1]+BD[3]*BD[5]+fs*.35);g.restore();
}
function render(){
  g.clearRect(0,0,W,H);g.save();
  if(shake>.3)g.translate((Math.random()-.5)*shake,(Math.random()-.5)*shake);
  g.fillStyle='#fff';g.fillRect(-20,-20,W+40,H+40);
  drawChar();drawBubble();
  if(flash>.02){g.fillStyle=`rgba(255,255,255,${flash*.6})`;g.fillRect(-20,-20,W+40,H+40)}
  if(sp>.9)trail.forEach((p,i)=>drawHand(p[0],p[1],p[2],1,.12*(i+1)));
  drawHand(mx,my,rot(),1+kick*.2,1);
  g.restore();
}
cv.width=W*2;cv.height=H*2;g.setTransform(2,0,0,2,0,0);

let prev=performance.now();
function loop(now){
  const dt=Math.min(.033,(now-prev)/1000);prev=now;
  update(dt);render();requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
